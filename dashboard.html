<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>轻舟 · 推荐配置方案</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #F8FAFB; }
  .dash-container { max-width: 1100px; margin: 0 auto; padding: 40px 32px; }
  .dash-header {
    background: linear-gradient(135deg, #0A1628 0%, #1A3050 100%);
    border-radius: 20px; padding: 40px 48px; margin-bottom: 32px;
    color: #fff; display: flex; align-items: center; justify-content: space-between;
  }
  .dash-header h1 { font-size: 28px; font-weight: 700; color: #fff; }
  .dash-header p { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 6px; }
  .dash-header .back-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer;
    font-size: 14px; text-decoration: none;
  }
  .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px; }
  .dash-card {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 1px 3px rgba(10,22,40,0.04), 0 4px 12px rgba(10,22,40,0.06);
    border: 1px solid #E4E8EC;
  }
  .dash-card h3 { font-size: 13px; color: #6B7A8C; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .dash-card canvas { max-height: 260px; }
  .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .metric-box {
    background: #fff; border-radius: 14px; padding: 20px; text-align: center;
    box-shadow: 0 1px 3px rgba(10,22,40,0.04); border: 1px solid #E4E8EC;
  }
  .metric-box .val { font-size: 26px; font-weight: 800; color: #0A1628; }
  .metric-box .lbl { font-size: 11px; color: #6B7A8C; margin-top: 4px; font-weight: 500; }
  .risk-bar { height: 6px; border-radius: 3px; background: linear-gradient(to right, #10B981, #F59E0B, #EF4444); margin: 12px 0; position: relative; }
  .risk-dot { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #0A1628; transform: translateX(-50%); }
  .risk-labels { display: flex; justify-content: space-between; font-size: 11px; color: #6B7A8C; }
  .evidence-list { list-style: none; font-size: 13px; color: #3A4A5C; line-height: 2; }
  .evidence-list li::before { content: '• '; color: #C8A45C; font-weight: 700; }
  .empty-state { text-align: center; padding: 80px 20px; color: #6B7A8C; }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state button {
    margin-top: 16px; padding: 10px 24px; border-radius: 10px;
    background: #0A1628; color: #fff; border: none; cursor: pointer; font-size: 14px;
  }
  .dash-footer { text-align: center; font-size: 12px; color: #6B7A8C; margin-top: 24px; }
  @media (max-width: 768px) { .dash-grid { grid-template-columns: 1fr; } .metrics-grid { grid-template-columns: repeat(2,1fr); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="dash-container">
  <div class="dash-header">
    <a class="back-btn" href="#" onclick="goBack()">← 返回聊天</a>
    <div>
      <h1>轻舟 · 推荐配置方案</h1>
      <p>基于您的风险偏好与对话生成，非实际持仓</p>
    </div>
  </div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state hidden">
    <div class="empty-icon">📊</div>
    <h3>暂无配置方案</h3>
    <p>您还没有让轻舟为您做过资产配置。</p>
    <p style="font-size:13px;color:#6B7A8C;margin-top:8px;">告诉轻舟您的资金量、投资时长和风险承受度，最快 1 分钟就能生成专属配置方案。</p>
    <p style="color:var(--text-secondary);">返回聊天页，试试这样说：</p>
    <div class="sample-queries">
      <span onclick="window.location.href='chat.html?mode=classic&q=%E5%B8%AE%E6%88%91%E9%85%8D%E7%BD%AE%E4%B8%80%E4%B8%8B%E6%88%91%E7%9A%84%E8%B5%84%E9%87%91'" style="cursor:pointer;">💬 "帮我配置一下我的资金"</span>
      <span onclick="window.location.href='chat.html?mode=classic&q=20%E4%B8%873%E5%B9%B4%E4%B8%8D%E7%94%A8%E6%80%8E%E4%B9%88%E5%88%86%E9%85%8D'" style="cursor:pointer;">💬 "20 万 3 年不用，怎么分配？"</span>
      <span onclick="window.location.href='chat.html?mode=classic&q=%E6%8E%A8%E8%8D%90%E4%B8%80%E4%B8%AA%E9%80%82%E5%90%88%E6%88%91%E7%9A%84%E6%8A%95%E8%B5%84%E7%BB%84%E5%90%88'" style="cursor:pointer;">💬 "推荐一个适合我的投资组合"</span>
    </div>
    
  </div>

  <!-- Content -->
  <div id="dashboardContent" class="hidden">
    <!-- Risk Gauge -->
    <div class="dash-card" style="grid-column:1/-1;" id="riskGaugeCard"></div>

    <!-- Charts Row -->
    <div class="dash-grid">
      <div class="dash-card">
        <h3>推荐配置方案（基于您的回答）</h3>
        <canvas id="pieChart"></canvas>
      </div>
      <div class="dash-card">
        <h3>预期收益区间（历史回测模拟）</h3>
        <canvas id="lineChart"></canvas>
      </div>
    </div>

    <!-- Metrics -->
    <div class="dash-card" style="grid-column:1/-1;">
      <h3>方案指标（基于推荐组合回测）</h3>
      <div class="metrics-grid" id="metricsRow"></div>
    </div>

    <!-- Evidence -->
    <div class="dash-card" style="grid-column:1/-1;" id="evidenceCard">
      <h3>📋 方案依据</h3>
      <ul class="evidence-list" id="evidenceList"></ul>
    </div>

    <!-- Compliance -->
    <p style="text-align:center;font-size:var(--font-size-sm);color:var(--compliance-tag);margin-top:var(--spacing-lg);">
      ⚠️ 以上为参考建议，历史回测不代表未来收益。投资需谨慎。
    </p>
  </div>
</div>

<script src="js/storage.js?v=29"></script>
<script src="js/profile_engine.js?v=29"></script>
<script src="js/risk_calculator.js?v=29"></script>
<script src="js/dashboard.js?v=29"></script>
</body>
</html>
