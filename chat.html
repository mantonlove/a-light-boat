<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>轻舟 · 对话</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo"><img src="assets/logo.png" alt="轻舟"></div>
    <div class="nav-item active" onclick="goTo('chat.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">对话</span>
    </div>
    <div class="nav-item" onclick="goTo('recommend.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
      <span class="nav-label">推荐</span>
    </div>
    <div class="nav-item" onclick="goTo('account.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 0 2h-2a1 1 0 0 0 0 2h2a1 1 0 0 1 0 2H5a2 2 0 0 0 0 4h13a1 1 0 0 0 1-1v-3"/></svg>
      <span class="nav-label">账户</span>
    </div>
    <div class="nav-item" onclick="goTo('mine.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">我的</span>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="brand"><img src="assets/logo.png" alt="">轻<span>舟</span></div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message ai">
        <div class="avatar"><img src="assets/logo.png" alt=""></div>
        <div>
          <div class="bubble">
            <div class="sender">轻舟</div>
            <span id="welcomeMsg">您好，我是轻舟，您的智慧银行理财顾问。请问有什么可以帮您？</span>
            <div class="preset-inline" id="presetBar"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="privacy-guide hidden" id="privacyGuide">
      <h4 id="privacyTitle">隐私与个性化服务说明</h4>
      <p>为提供更精准的理财建议，轻舟会在对话中了解您的投资偏好和资产情况，并建立个人档案。</p>
      <ul>
        <li>您的档案仅存储在本地，可随时修改或删除</li>
        <li>未经您确认，不会用于其他用途</li>
        <li>您可以随时在「我的」中管理授权</li>
      </ul>
      <div class="privacy-actions"><button onclick="acceptPrivacy()">我知道了</button></div>
    </div>

    <div class="image-preview-row hidden" id="imagePreview">
      <img id="previewImg" src="" alt="">
      <button class="remove-img" onclick="removeImage()">✕</button>
    </div>

    <div class="chat-input-area">
      <div class="input-row">
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="handleImageUpload(event)" style="display:none;">
        <button class="ib-btn" onclick="triggerUpload()" title="上传图片或拍照">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <textarea id="userInput" rows="1" placeholder="输入您的问题..." onkeydown="handleKeyDown(event)"></textarea>
        <button class="ib-btn" id="voiceBtn" onclick="toggleVoice()" title="语音输入（说出您的问题）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button class="ib-btn" onclick="triggerHandoff('用户主动请求人工')" title="转接人工理财顾问">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </button>
        <button class="ib-btn send-btn" onclick="sendMessage()" id="sendBtn" disabled title="发送消息">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="js/storage.js?v=5"></script>
<script src="js/config.js?v=5"></script>
<script src="js/demo_products_index.js?v=5" defer></script>
<script src="js/product_catalog.js?v=5" defer></script>
<script src="js/market_data.js?v=5" defer></script>
<script src="js/router.js?v=5"></script>
<script src="js/profile_engine.js?v=5"></script>
<script src="js/data.js?v=5"></script>
<script src="js/api.js?v=5"></script>
<script src="js/chat.js?v=5"></script>
</body>
</html>
