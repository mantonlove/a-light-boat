<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>轻舟 · 我的</title>
<style>
  :root {
    --navy: #0A1628; --navy-light: #1A3050; --gold: #C8A45C;
    --surface: #F8FAFB; --card: #FFFFFF; --text: #0F1A2A;
    --text-2: #3A4A5C; --text-3: #6B7A8C; --border: #E4E8EC;
    --radius: 16px; --shadow: 0 1px 3px rgba(10,22,40,.04), 0 4px 12px rgba(10,22,40,.06);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --fs-base: 16px; --fs-sm: 13px; --fs-lg: 20px; --fs-xl: 28px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); font-size:var(--fs-base); background:var(--surface); color:var(--text); -webkit-font-smoothing:antialiased; }
  .page { max-width:720px; margin:0 auto; padding:40px 24px; }
  .back { color:var(--text-3); text-decoration:none; font-size:14px; display:inline-flex; align-items:center; gap:6px; margin-bottom:24px; }
  .back:hover { color:var(--navy); }

  /* Profile card */
  .profile {
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    border-radius:20px; padding:36px 32px; margin-bottom:32px;
    color:#fff; display:flex; align-items:center; gap:24px;
    box-shadow:0 4px 20px rgba(10,22,40,.15);
  }
  .profile .avatar { width:72px; height:72px; border-radius:50%; background:rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer; flex-shrink:0; overflow:hidden; border:2px solid rgba(255,255,255,.2); }
  .profile .avatar:hover { background:rgba(255,255,255,.2); }
  .profile .info { flex:1; }
  .profile .info .name { font-size:var(--fs-lg); font-weight:700; }
  .profile .info .risk { font-size:var(--fs-sm); opacity:.7; margin-top:4px; }
  .profile .info .risk span { color:var(--gold); font-weight:600; opacity:1; }
  .profile .actions { display:flex; gap:8px; margin-top:12px; }
  .profile .actions button {
    padding:6px 14px; border-radius:8px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:12px; cursor:pointer; transition:all .2s;
  }
  .profile .actions button:hover { background:rgba(255,255,255,.18); }

  /* Sections */
  .section { margin-bottom:28px; }
  .section-title { font-size:calc(var(--fs-sm) - 1px); font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
  .card { background:var(--card); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); border:1px solid var(--border); font-size:var(--fs-sm); }

  /* Mode selector */
  .modes { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .mode-opt { padding:16px 12px; border-radius:12px; border:2px solid var(--border); text-align:center; cursor:pointer; transition:all .2s; }
  .mode-opt:hover { border-color:var(--navy-light); }
  .mode-opt.active { border-color:var(--navy); background:#F0F4F8; }
  .mode-opt .icon { font-size:24px; margin-bottom:4px; }
  .mode-opt .label { font-size:13px; font-weight:600; color:var(--text); }

  /* Font size */
  .fonts { display:flex; gap:8px; margin:16px 0; }
  .font-opt { padding:8px 18px; border-radius:10px; border:1.5px solid var(--border); cursor:pointer; font-size:13px; transition:all .2s; }
  .font-opt.active { border-color:var(--navy); background:var(--navy); color:#fff; }

  /* Toggle row */
  .trow { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--border); }
  .trow:last-child { border-bottom:none; }
  .trow .tl { font-size:14px; font-weight:500; }
  .trow .td { font-size:12px; color:var(--text-3); margin-top:2px; }
  .toggle { width:46px; height:26px; border-radius:13px; background:var(--border); cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
  .toggle.on { background:var(--navy); }
  .toggle::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  .toggle.on::after { transform:translateX(20px); }

  /* Risk card */
  .risk-section { margin-bottom:28px; }
  .risk-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .risk-level { font-size:20px; font-weight:700; }
  .risk-gauge { height:6px; border-radius:3px; background:linear-gradient(to right,#10B981,#F59E0B,#EF4444); margin:12px 0; position:relative; }
  .risk-dot { position:absolute; top:-5px; width:16px; height:16px; border-radius:50%; background:#fff; border:3px solid var(--navy); transform:translateX(-50%); }
  .risk-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--text-3); }

  /* Archive */
  .archive-field { padding:12px 0; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .archive-field:last-child { border-bottom:none; }
  .archive-field .f-label { font-size:13px; color:var(--text-3); }
  .archive-field .f-value { font-size:14px; font-weight:600; }
  .archive-field .f-actions { display:flex; gap:6px; }
  .edit-btn { padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--card); color:var(--text-3); font-size:11px; cursor:pointer; }
  .edit-btn:hover { border-color:var(--navy); color:var(--navy); }

  /* Modal */
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px); }
  .modal-overlay.hidden { display:none; }
  .modal-box { background:#fff;border-radius:16px;width:380px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden; }
  .modal-head { display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700; }
  .modal-body { padding:20px; }
  .modal-body input { width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;outline:none; }
  .modal-body input:focus { border-color:var(--navy); }
  .modal-body label { display:block;font-size:12px;color:var(--text-3);margin-bottom:6px; }
  .modal-foot { display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border); }
  .modal-foot button { padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600; }
  .btn-primary { background:var(--navy);color:#fff; }
  .btn-cancel { background:var(--surface);color:var(--text-3);border:1px solid var(--border); }

  .toast { position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards; }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
  @keyframes toastOut { from{opacity:1} to{opacity:0} }

  @media(max-width:600px){ .modes{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="#" onclick="goBack()">← 返回聊天</a>

  <!-- Profile Card -->
  <div class="profile">
    <div class="avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()" title="点击上传头像">👤</div>
    <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarUpload(event)" style="display:none;">
    <div class="info">
      <div class="name" id="profileName">张三</div>
      <div class="risk">风险偏好：<span id="profileRisk">未评估</span></div>
      <div class="actions">
        <button onclick="editProfile()">编辑资料</button>
        <button onclick="switchAccount()">切换账号</button>
        <button onclick="logout()">退出</button>
      </div>
    </div>
  </div>

  <!-- Appearance -->
  <div class="section">
    <div class="section-title">外观与服务</div>
    <div class="card">
      <p style="font-size:13px;color:var(--text-3);margin-bottom:12px;">界面模式</p>
      <div class="modes" id="modeSelector"></div>
      <p style="font-size:13px;color:var(--text-3);margin:18px 0 12px;">字体大小</p>
      <div class="fonts" id="fontSizeRow"></div>
      <div class="trow">
        <div><div class="tl">语音播报</div><div class="td">AI 回复自动朗读，朗读完毕自动续听</div></div>
        <div class="toggle" id="voiceToggle" onclick="toggleVoice()"></div>
      </div>
      <p style="font-size:13px;color:var(--text-3);margin:18px 0 12px;">语音音色</p>
      <div class="voice-grid" id="voicePresetRow"></div>
    </div>
  </div>

  <!-- Risk -->
  <div class="section">
    <div class="section-title">理财偏好</div>
    <div class="card">
      <div class="risk-header">
        <span class="risk-level" id="riskLevelDisplay">📋 风险偏好验证</span>
        <button class="edit-btn" onclick="startReassessment()" style="padding:8px 16px;font-size:12px;">重新评估</button>
      </div>
      <div id="riskDetail"></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <p style="font-size:13px;font-weight:600;margin-bottom:8px;">个性化推荐</p>
      <div class="trow"><div><div class="tl">根据风险偏好推荐</div></div><div class="toggle on" id="pref1" onclick="togglePref('recommendByRisk',this)"></div></div>
      <div class="trow"><div><div class="tl">根据投资期限筛选</div></div><div class="toggle on" id="pref2" onclick="togglePref('recommendByHorizon',this)"></div></div>
      <div class="trow"><div><div class="tl">市场热点推送</div></div><div class="toggle" id="pref3" onclick="togglePref('marketHotPush',this)"></div></div>
      <div class="trow"><div><div class="tl">每周市场周报</div></div><div class="toggle on" id="pref4" onclick="togglePref('weeklyReport',this)"></div></div>
    </div>
  </div>

  <!-- Archive -->
  <div class="section">
    <div class="section-title">个人档案 · AI 对话自动记录</div>
    <div class="card" id="archiveCard"><div id="archiveContent"></div></div>
  </div>

  <!-- Account -->
  <div class="section">
    <div class="section-title">账户安全</div>
    <div class="card">
      <div class="trow"><div><div class="tl">绑定手机</div><div class="td" id="accountPhone">138****1234</div></div><button class="edit-btn" onclick="changePhone()">更换</button></div>
      <div class="trow"><div><div class="tl">绑定邮箱</div><div class="td" id="accountEmail">zhang***@**.com</div></div><button class="edit-btn" onclick="changeEmail()">更换</button></div>
      <div class="trow"><div><div class="tl">登录密码</div><div class="td">********</div></div><button class="edit-btn" onclick="changePassword()">修改</button></div>
      <div style="text-align:center;margin-top:16px;">
        <button onclick="logout()" style="background:none;border:1px solid #EF4444;color:#EF4444;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;">退出当前账号</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle">编辑</span><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-3);">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-primary" id="modalConfirm">确认</button></div>
  </div>
</div>

<script src="js/storage.js?v=43"></script>
<script src="js/profile_engine.js?v=43"></script>
<script src="js/mine.js?v=43"></script>
</body>
</html>
