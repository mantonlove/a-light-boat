<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>轻舟 · 我的</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo"><img src="assets/logo.png" alt="轻舟"></div>
    <div class="nav-icon" title="对话" onclick="goTo('chat.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="nav-icon" title="推荐中心" onclick="goTo('recommend.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
    </div>
    <div class="nav-icon active" title="我的" onclick="goTo('mine.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div class="brand"><img src="assets/logo.png" alt="">轻<span>舟</span></div>
      <span class="mode-badge" id="modeBadge" onclick="switchMode()" title="点击切换模式">经典版</span>
    </div>

    <div style="flex:1;overflow-y:auto">
    <div class="mine-page">

      <div class="profile-card">
        <div class="p-avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()" title="点击上传头像">👤</div>
        <input type="file" id="avatarInput" accept="image/*" onchange="handleAvatarUpload(event)" style="display:none;">
        <div style="flex:1">
          <div class="p-name" id="profileName">张三</div>
          <div class="p-risk">风险偏好：<span id="profileRisk">未评估</span></div>
          <div class="p-actions">
            <button class="p-btn" onclick="editProfile()">编辑资料</button>
            <button class="p-btn" onclick="switchAccount()">切换账号</button>
            <button class="p-btn" onclick="logout()">退出</button>
          </div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">外观与服务</div>
        <div class="card">
          <div style="font-size:10px;color:var(--ink-40);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">界面模式</div>
          <div class="mode-row" id="modeSelector" style="margin-bottom:var(--s2)"></div>
          <div style="font-size:10px;color:var(--ink-40);margin:14px 0 10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700">字体大小</div>
          <div class="font-row" id="fontSizeRow" style="margin-bottom:var(--s2)"></div>
          <div class="trow">
            <div><div class="tl">语音播报</div><div class="td">AI 回复自动朗读，朗读完毕自动续听</div></div>
            <div class="toggle" id="voiceToggle" onclick="toggleVoice()"></div>
          </div>
          <div class="collapsible" style="margin-top:12px">
            <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
              <div class="col-title">
                <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                语音音色
              </div>
              <span class="col-arrow">▼</span>
            </div>
            <div class="col-body" id="voicePresetRow"></div>
          </div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">理财偏好</div>
        <div class="collapsible open" id="riskCollapse">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
              风险偏好验证
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="riskDetail"></div>
        </div>
        <div class="collapsible">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              个性化推荐
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="prefsBody"></div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">个人档案 · AI 对话自动记录</div>
        <div class="collapsible">
          <div class="col-head" onclick="this.parentElement.classList.toggle('open')">
            <div class="col-title">
              <svg class="col-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              个人档案
            </div>
            <span class="col-arrow">▼</span>
          </div>
          <div class="col-body" id="archiveContent"></div>
        </div>
      </div>

      <div class="mine-section">
        <div class="sec-label">账户安全</div>
        <div class="card" style="padding:0 var(--s2)">
          <div class="trow"><div class="tl">绑定手机 <span style="color:var(--ink-40);font-weight:400" id="accountPhone">138****1234</span></div><span style="font-size:11px;color:var(--ink);cursor:pointer;font-weight:600" onclick="changePhone()">更换</span></div>
          <div class="trow"><div class="tl">绑定邮箱 <span style="color:var(--ink-40);font-weight:400" id="accountEmail">zhang***@**.com</span></div><span style="font-size:11px;color:var(--ink);cursor:pointer;font-weight:600" onclick="changeEmail()">更换</span></div>
          <div class="trow"><div class="tl">登录密码 <span style="color:var(--ink-40);font-weight:400">********</span></div><span style="font-size:11px;color:var(--ink);cursor:pointer;font-weight:600" onclick="changePassword()">修改</span></div>
        </div>
      </div>

    </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle">编辑</span><button onclick="closeModal()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-40)">✕</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn-outline" style="padding:8px 18px;border-radius:8px;font-size:14px" onclick="closeModal()">取消</button><button class="btn-primary" style="padding:8px 18px;border-radius:8px;font-size:14px" id="modalConfirm">确认</button></div>
  </div>
</div>

<script src="js/storage.js?v=5"></script>
<script src="js/profile_engine.js?v=5"></script>
<script src="js/mine.js?v=5"></script>
</body>
</html>
