<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>轻舟 — 智慧银行理财顾问</title>
<link rel="stylesheet" href="css/style.css?v=5">
<style>
  body { background: var(--surface); }
</style>
</head>
<body>

<div class="welcome-page">
  <div class="wl-tag">选择您的体验模式</div>
  <h1>轻<span>舟</span></h1>
  <p class="wl-sub">您的智慧银行理财顾问</p>

  <div class="wl-cards">
    <!-- 经典版 -->
    <div class="wl-card" onclick="enter('classic')">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg>
      </div>
      <div class="wc-name">经典版</div>
      <div class="wc-who">适合普通成年客户</div>
      <ul class="wc-features">
        <li>全品类理财产品查询与对比</li>
        <li>基于风险偏好的配置建议</li>
        <li>专业市场数据与宏观解读</li>
      </ul>
      <div class="wc-btn primary">进入经典版</div>
    </div>

    <!-- 关怀版 -->
    <div class="wl-card" onclick="enter('senior')">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg>
      </div>
      <div class="wc-name">关怀版</div>
      <div class="wc-who">适合老年客户</div>
      <ul class="wc-features">
        <li>全程语音对话，无需打字</li>
        <li>大字号、高对比度配色</li>
        <li>生活化语言讲解金融概念</li>
      </ul>
      <div class="wc-btn primary">进入关怀版</div>
    </div>

    <!-- 青春版 -->
    <div class="wl-card" onclick="enter('youth')">
      <div class="wc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg>
      </div>
      <div class="wc-name">青春版</div>
      <div class="wc-who">适合年轻客户</div>
      <ul class="wc-features">
        <li>数据可视化、图表驱动交互</li>
        <li>ESG、AI、ETF 等新概念</li>
        <li>快节奏对话，专业不啰嗦</li>
      </ul>
      <div class="wc-btn primary">进入青春版</div>
    </div>
  </div>
</div>

<script src="js/storage.js?v=5"></script>
<script>
function enter(mode) {
  Storage.set('qingzhou_mode', mode);
  window.location.href = 'chat.html?mode=' + mode;
}
</script>
</body>
</html>
